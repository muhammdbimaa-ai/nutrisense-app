<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NutriSense</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail on desktop, bottom tab bar on phone. Content = hero ring + macro bars, then water + suggestions, then meal log. */
:root{
  --bg:#F1F7F3; --surface:#FFFFFF; --surface-2:#E8F2EB; --ink:#10261A; --muted:#58705F; --line:#D5E4D9;
  --green:#17A05D; --lime:#B6E04A; --btn-bg:#0E7A45; --btn-ink:#FFFFFF; --green-soft:#DDF3E5; --green-ink:#0B6B3B;
  --pro:#4F6BFF; --carb:#F2A324; --fat:#EF5E7B; --fib:#12A8A0; --water:#2AA6E8;
  --bad:#D6453D; --warn:#B87908; --ok:#0E8A4E;
  --shadow:0 1px 2px rgba(16,38,26,.06),0 10px 28px rgba(16,38,26,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1710; --surface:#13241B; --surface-2:#1A3126; --ink:#E4F1E8; --muted:#8FAA99; --line:#25443A;
  --green:#34C77B; --lime:#C4EA5C; --btn-bg:#34C77B; --btn-ink:#06210F; --green-soft:#183A2B; --green-ink:#7BE3A8;
  --pro:#8196FF; --carb:#F6B84A; --fat:#F58AA0; --fib:#3CCBC3; --water:#5CBFF2;
  --bad:#FF7A70; --warn:#E9B13C; --ok:#4BD38A; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1710; --surface:#13241B; --surface-2:#1A3126; --ink:#E4F1E8; --muted:#8FAA99; --line:#25443A;
  --green:#34C77B; --lime:#C4EA5C; --btn-bg:#34C77B; --btn-ink:#06210F; --green-soft:#183A2B; --green-ink:#7BE3A8;
  --pro:#8196FF; --carb:#F6B84A; --fat:#F58AA0; --fib:#3CCBC3; --water:#5CBFF2;
  --bad:#FF7A70; --warn:#E9B13C; --ok:#4BD38A; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:none}
.rail a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600;transition:background .2s,color .2s}
.rail a[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.rail a:hover{color:var(--ink)}
main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--lime));color:#06210F}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:.7rem;color:var(--muted);margin-top:-3px}

.view{display:grid;gap:16px;animation:enter .35s ease both}
@keyframes enter{from{opacity:.5;transform:translateY(8px)}}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--green-soft);color:var(--green-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--btn-bg) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:10px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--carb) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--carb) 40%,var(--line));font-size:.85rem}

/* date nav */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .lbl{font-weight:700;font-family:var(--f-display);min-width:0}

/* hero */
.hero{display:grid;gap:18px;align-items:center;grid-template-columns:minmax(0,1fr)}
.ringwrap{position:relative;width:min(220px,64vw);aspect-ratio:1;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring-fg{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:326.73;animation:ring 1.1s cubic-bezier(.2,.8,.2,1) both;transition:stroke-dashoffset .6s ease}
@keyframes ring{from{stroke-dashoffset:326.73}}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-display);font-size:2.4rem;line-height:1}
.ring-c span{font-size:.78rem;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--surface-2)}
.stat span{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:1.25rem}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.split i{display:block;height:100%;transition:width .5s}

/* macro bars */
.mrow+.mrow{margin-top:14px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem}
.mhead .mval{margin-left:auto;color:var(--muted);font-size:.82rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transition:width .5s}
.bar.over i{background:var(--bad)}
@keyframes grow{from{transform:scaleX(0)}}

/* water */
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.cup{aspect-ratio:3/4;border-radius:8px 8px 14px 14px;border:2px solid var(--line);background:linear-gradient(to top,var(--water) 0 0) bottom/100% 0% no-repeat,var(--surface);transition:background-size .45s ease,border-color .3s;padding:0}
.cup.on{background-size:100% 82%;border-color:var(--water)}
.cup:hover{border-color:var(--water)}
.waterline{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.waterline b{font-family:var(--f-display);font-size:1.7rem;color:var(--water)}

/* recs */
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2)}
.rec+.rec{margin-top:8px}
.rec b{font-size:.92rem}
.rec span{font-size:.78rem;color:var(--muted)}
.callout{padding:12px 14px;border-radius:14px;background:var(--green-soft);color:var(--green-ink);font-size:.88rem;font-weight:500;margin-bottom:12px}
.callout.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--ink)}

/* log */
.meal+.meal{margin-top:18px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.meal-h h3{display:flex;align-items:center;gap:8px}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.entry{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);animation:enter .3s ease both}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.einfo{min-width:0}
.einfo b{display:block;font-size:.92rem;overflow-wrap:anywhere}
.einfo>span{font-size:.76rem;color:var(--muted);display:block;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips em{font-style:normal;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ekcal{text-align:right;line-height:1.1}
.ekcal b{font-family:var(--f-display);font-size:1.1rem}
.ekcal small{display:block;color:var(--muted);font-size:.68rem}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.85rem;text-align:center}

/* forms */
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:.75rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
textarea{resize:vertical;min-height:64px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 6px;border-radius:10px;font-size:.82rem;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:3px solid var(--green)}
.formgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.formgrid .full{grid-column:1/-1}

/* scan */
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:26px 16px;border:2px dashed var(--line);border-radius:16px;background:var(--surface-2);color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.drag{border-color:var(--green);background:var(--green-soft)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:#000;max-height:340px;display:grid;place-items:center}
.photo img{max-width:100%;max-height:340px;display:block}
.photo.scanning::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--lime);box-shadow:0 0 18px 6px var(--lime);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:96%}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.irow{padding:12px;border:1px solid var(--line);border-radius:14px;display:grid;gap:8px;animation:enter .25s ease both}
.irow+.irow{margin-top:10px}
.irow-main{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 90px 120px 36px;align-items:end}
.irow-meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.irow-meta b{color:var(--ink)}
.custom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.custom input{padding:8px}
.tot-k{font-family:var(--f-display);font-size:2.6rem;line-height:1}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tcell{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.tcell span{font-size:.72rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tcell b{font-family:var(--f-display);font-size:1.2rem}
.tcell small{color:var(--muted);font-size:.7rem}

/* tables */
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.85rem}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tbody tr+tr td{border-top:1px solid var(--line)}
tfoot td{background:var(--surface-2);font-weight:700}
td.today{font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart .v{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tgt{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4}
.chart .b-ok{fill:var(--green)}.chart .b-lo{fill:var(--carb)}.chart .b-hi{fill:var(--bad)}.chart .b-0{fill:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.csv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;min-height:120px;white-space:pre}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .irow-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}
  .irow-main .nm{grid-column:1/-1}
  .entry{grid-template-columns:44px minmax(0,1fr) auto}
  .entry .del{grid-column:3;grid-row:2;justify-self:end}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .custom{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:760px){
  .hero{grid-template-columns:240px minmax(0,1fr);gap:28px}
}
@media (min-width:1000px){
  body{padding-block:28px 40px}
  .app{grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
  .rail{position:sticky;top:28px;left:auto;right:auto;bottom:auto;grid-template-columns:1fr;align-content:start;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);gap:6px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:4px 8px 14px}
  .brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--lime));color:#06210F}
  .rail a{flex-direction:row;gap:12px;font-size:.9rem;padding:11px 12px}
  .topbar .logo{display:none}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2.wide-l{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function findFood(q){
  q=norm(q);if(q.length<2)return null;
  var best=null,bs=0,qt=q.split(' ');
  FN.forEach(function(x){
    var s=0;
    if(x.n===q)s=100;
    else if(x.n.indexOf(q)===0)s=70+q.length/x.n.length*10;
    else if(x.n.indexOf(q)>-1)s=55;
    else if(q.indexOf(x.n)>-1)s=50+x.n.length/q.length*10;
    else{var o=qt.filter(function(w){return w.length>2&&x.t.indexOf(w)>-1}).length;s=o*22-(x.t.length-o)*2}
    if(s>bs){bs=s;best=x.f}
  });
  return bs>=22?best:null;
}

function targets(p){
  var w=clamp(+p.weight||60,30,300),h=clamp(+p.height||165,120,230),a=clamp(+p.age||25,12,100);
  var bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);
  var tdee=bmr*(+p.activity||1.375);
  var kcal=p.goal==='cut'?tdee*0.8:p.goal==='bulk'?tdee+400:tdee;
  kcal=Math.max(kcal,p.sex==='f'?1200:1500);
  var prot=w*(p.goal==='cut'?2.0:p.goal==='bulk'?1.8:1.5);
  var fat=kcal*0.25/9;
  var carb=Math.max(0,(kcal-prot*4-fat*9)/4);
  var water=Math.round(w*0.035*10)/10;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal),p:Math.round(prot),c:Math.round(carb),f:Math.round(fat),
    fi:Math.round(kcal/1000*14),water:water,glasses:Math.ceil(water*4),bmi:w/Math.pow(h/100,2)};
}

function recommendations(t,d,key){
  var remK=t.kcal-d.k,remP=t.p-d.p,html='',items=[];
  var low=remK<=t.kcal*0.2;
  if(remK<=0)html+='<div class="callout warn">Kuota kalori hari ini sudah habis ('+fmt(-remK)+' kcal berlebih). Pilih makanan sangat ringan atau cukup minum air putih.</div>';
  else if(low)html+='<div class="callout warn">Kalori hampir habis, sisa '+fmt(remK)+' kcal. Pilih sumber protein yang ringan kalori.</div>';
  if(remP>t.p*0.25&&!(remK<=0&&remP<=0)){
    html+='<div class="callout'+(remK<=0?' warn':'')+'">Protein masih kurang '+fmt(remP)+' g dari target '+fmt(t.p)+' g.</div>';
  }
  if(remP>0||low){
    var pool=FOODS.filter(function(f){return f.k<=260&&f.p*4/f.k>=0.4&&f.p>=8}).sort(function(a,b){return b.p/b.k-a.p/a.k});
    var budget=remK>0?remK:90;
    pool.some(function(f){
      if(items.length>=4)return true;
      var needG=remP>0?Math.min(remP,25)/f.p*100:100;
      var capG=budget/f.k*100;
      var g=Math.round(Math.min(needG,capG,250)/5)*5;
      if(g<40)return false;
      items.push({f:f,g:g,k:f.k*g/100,p:f.p*g/100});return false;
    });
  }
  if(items.length){
    html+=items.map(function(r,i){return '<div class="rec"><b>'+esc(r.f.name)+' '+r.g+' g</b><button class="btn sm primary" data-rec="'+i+'">'+ic('plus')+'Tambah</button><span>+'+fmt(r.p,1)+' g protein · '+fmt(r.k)+' kcal</span></div>'}).join('');
  }
  // swaps
  var SWAP={'ayam goreng':'Ayam bakar','tempe goreng':'Tempe kukus','tahu goreng':'Tahu putih','nasi putih':'Nasi merah','gorengan bakwan':'Edamame','mie goreng':'Gado-gado','kentang goreng':'Kentang rebus','nasi goreng':'Nasi merah','teh manis':'Kopi hitam','susu sapi full cream':'Susu rendah lemak','ikan lele goreng':'Ikan bakar kembung','roti tawar':'Roti gandum','kerupuk':'Timun','pisang goreng':'Pisang'};
  var sw=[],seen={};
  (S.log[key]||[]).forEach(function(e){e.items.forEach(function(it){
    var alt=SWAP[norm(it.name)];if(!alt||seen[it.name])return;
    var o=foodByName(it.name),a=foodByName(alt);if(!o||!a)return;
    var save=(o.k-a.k)*it.g/100,dp=(a.p-o.p)*it.g/100;
    if(save>=20){seen[it.name]=1;sw.push({from:it.name,to:alt,save:save,dp:dp})}
  })});
  sw.sort(function(a,b){return b.save-a.save});
  if(sw.length){
    html+='<h3 style="margin:16px 0 8px;font-size:.9rem">Alternatif lebih ringan</h3>'+sw.slice(0,3).map(function(s){
      return '<div class="rec" style="grid-template-columns:minmax(0,1fr)"><b>'+esc(s.from)+' &rarr; '+esc(s.to)+'</b><span>Hemat '+fmt(s.save)+' kcal'+(s.dp>=1?', protein +'+fmt(s.dp,1)+' g':'')+' untuk porsi yang sama</span></div>'}).join('');
  }
  if(!html)html='<div class="callout">Asupan hari ini seimbang. Pertahankan, dan jangan lupa minum air.</div>';
  return {html:html,items:items};
}

  var fd=findFood(it.q),amt=parseFloat(it.amt)||0,g=amt;
  if(it.unit==='p'&&fd)g=amt*fd.pg;
  var base=fd?{k:fd.k,p:fd.p,c:fd.c,f:fd.f,fi:fd.fi}:(hasCustom(it.custom)?{k:+it.custom.k||0,p:+it.custom.p||0,c:+it.custom.c||0,f:+it.custom.f||0,fi:+it.custom.fi||0}:null);

var UNITS=['kg','gram','gr','g','ml','porsi','piring','mangkuk','butir','buah','potong','lembar','gelas','cup','sdm','scoop','tusuk','fillet','ekor','genggam','keping','slice','cangkir'];
function parseDesc(text){
  var parts=text.split(/[,;\n+]|\bdan\b|&/i).map(function(s){return s.trim()}).filter(Boolean),out=[];
  parts.forEach(function(p){
    var m=p.match(/(\d+(?:[.,]\d+)?)\s*([a-zA-Z]+)?/),amt=null,unit=null,name=p;
    if(m){amt=parseFloat(m[1].replace(',','.'));var u=(m[2]||'').toLowerCase();
      if(UNITS.indexOf(u)>-1){unit=u;name=p.replace(m[0],' ')}else name=p.replace(m[1],' ')}
    name=name.replace(/\b(x|sebanyak|sekitar|dengan)\b/gi,' ').replace(/\s+/g,' ').trim();
    if(!name)return;
    var fd=findFood(name),r;
    if(amt==null)r=fd?{amt:1,unit:'p'}:{amt:100,unit:'g'};
    else if(unit==='kg')r={amt:amt*1000,unit:'g'};
    else if(unit==='g'||unit==='gr'||unit==='gram'||unit==='ml')r={amt:amt,unit:'g'};
    else if(unit)r=fd?{amt:amt,unit:'p'}:{amt:amt*100,unit:'g'};
    else r=(fd&&amt<=10)?{amt:amt,unit:'p'}:{amt:amt,unit:'g'};
    out.push(newItem(fd?fd.name:name,r.amt,r.unit));
  });
  return out;
}
function analyzePhoto(img){
  var c=document.createElement('canvas');c.width=c.height=40;var x=c.getContext('2d');
  var w=0,y=0,br=0,gr=0,rd=0,n=1600;
  try{x.drawImage(img,0,0,40,40);var d=x.getImageData(0,0,40,40).data;
    for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if(mn>195&&mx-mn<40)w++;
      else if(r>185&&g>150&&b>80&&b<175&&r-b>45)y++;
      else if(g>r+10&&g>b+10)gr++;
      else if(r>150&&g<125&&b<105&&r-g>50)rd++;
      else if(r>g&&g>b&&r>65&&r<195&&r-b>35&&g>35&&g<145)br++}}catch(e){}
  w/=n;y/=n;gr/=n;rd/=n;br/=n;
  var res=[];function cf(v,base){return Math.round(clamp(base+v*120,52,94))}
  if(y>0.28&&w<0.18)res.push({q:'Nasi goreng',amt:1,unit:'p',cf:cf(y,55)});
  else{
    if(w+y>0.14&&w>=y*0.6)res.push({q:'Nasi putih',amt:1,unit:'p',cf:cf(w,58)});
    if(y>0.12)res.push({q:'Telur dadar',amt:1,unit:'p',cf:cf(y,52)});
  }
  if(br>0.12)res.push(br>0.28?{q:'Ayam goreng',amt:1,unit:'p',cf:cf(br,56)}:{q:'Tempe goreng',amt:3,unit:'p',cf:cf(br,52)});
  if(gr>0.08)res.push({q:'Kangkung tumis',amt:1,unit:'p',cf:cf(gr,56)});
  if(rd>0.06)res.push({q:'Tomat',amt:1,unit:'p',cf:cf(rd,52)});
  if(!res.length)res=[{q:'Nasi putih',amt:1,unit:'p',cf:52},{q:'Ayam goreng',amt:1,unit:'p',cf:52}];
  return res;
}
function makeThumb(img){
  try{var c=document.createElement('canvas');c.width=c.height=72;var x=c.getContext('2d');
    var s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2;
    x.drawImage(img,sx,sy,s,s,0,0,72,72);return c.toDataURL('image/jpeg',0.7)}catch(e){return null}
}
function loadPhoto(file){
  if(!file||!/^image\//.test(file.type)){toast('Pilih file gambar (JPG, PNG, WebP)');return}
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=900,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      draft.photo=c.toDataURL('image/jpeg',0.82);draft.thumb=makeThumb(im);draft.note='';render();
    };
    im.onerror=function(){toast('Foto tidak bisa dibaca, coba file lain')};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

  if(dz){['dragover','dragenter'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('drag')})});
    ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('drag')})});
    dz.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadPhoto(f)})}
  var rp=$('#rmphoto');if(rp)rp.onclick=function(){draft.photo=null;draft.thumb=null;draft.note='';render()};
  var an=$('#analyze');
  if(an)an.onclick=function(){
    draft.scanning=true;draft.note='';render();
    var im=new Image();im.src=draft.photo;
    setTimeout(function(){
      var res=analyzePhoto(im);
      draft.items=res.map(function(r){return newItem(r.q,r.amt,r.unit)});
      draft.example=false;draft.scanning=false;
      var breakdown=res.map(function(r){var it=newItem(r.q,r.amt,r.unit);var c=itemCalc(it);return esc(r.q)+' ~'+r.cf+'%'+(c.ok?' &middot; '+fmt(c.g)+' g &middot; '+fmt(c.k)+' kcal &middot; P '+fmt(c.p,1)+'g &middot; K '+fmt(c.c,1)+'g &middot; L '+fmt(c.f,1)+'g':'')}).join('; ');
      draft.note='<b>Hasil simulasi deteksi (perkiraan):</b> '+breakdown+'. Tebakan ini berdasarkan warna dominan foto, bukan model AI sungguhan. Koreksi nama dan beratnya di langkah 2 agar hitungan akurat.';
      render();
    },1300);
  };
  $('#desc').addEventListener('input',function(e){draft.desc=e.target.value});
  $('#applydesc').onclick=function(){
    var list=parseDesc($('#desc').value);
    if(!list.length){toast('Tulis bahan dan beratnya dulu, mis. nasi putih 150 g');return}
    draft.items=list;draft.example=false;$('#exlbl').hidden=true;rebuildRows();toast(list.length+' bahan dihitung');
  };
  $('#addrow').onclick=function(){var it=newItem('',100,'g');draft.items.push(it);draft.example=false;$('#exlbl').hidden=true;rebuildRows();var el=$('#nm-'+it.uid);if(el)el.focus()};
  $$('input[name=meal]').forEach(function(r){r.onchange=function(){draft.meal=r.value}});
  $('#title').addEventListener('input',function(e){draft.title=e.target.value});
  $('#savemeal').onclick=function(){
    var list=[];
    draft.items.forEach(function(it){var c=itemCalc(it);if(c.ok)list.push({name:it.q.trim()||'Makanan',g:c.g,k:c.k,p:c.p,c:c.c,f:c.f,fi:c.fi})});
    if(!list.length){toast('Tambahkan minimal satu bahan dengan berat');return}
    var t=list.reduce(function(a,i){return {k:a.k+i.k,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f,fi:a.fi+i.fi,g:a.g+i.g}},{k:0,p:0,c:0,f:0,fi:0,g:0});
    var e={id:nid(),meal:draft.meal,name:list.map(function(i){return i.name}).join(' + '),title:draft.title.trim()||'',
      items:list.map(function(i){return {name:i.name,g:Math.round(i.g*10)/10}}),k:t.k,p:t.p,c:t.c,f:t.f,fi:t.fi,g:t.g,thumb:draft.thumb||null,sample:false};
    /* custom foods keep their own numbers: store totals directly (already in e) */
    (S.log[viewDate]=S.log[viewDate]||[]).push(e);store();
    toast('Tersimpan: '+fmt(t.k)+' kcal ke '+MEAL_NAME[draft.meal]);
    draft.photo=null;draft.thumb=null;draft.note='';draft.title='';draft.desc='';draft.items=[newItem()];draft.example=false;draft.meal=defaultMeal();
    go('dashboard');
  };
}

/* ---------- WEEKLY ---------- */
function weekData(){
  var t=targets(S.profile),end=new Date(),rows=[];
  for(var i=6;i>=0;i--){
    var k=dkey(addDays(end,-i)),d=dayTotals(k),w=(S.water[k]||0)*0.25,r=d.k/t.kcal,st;
    if(!(S.log[k]||[]).length)st=['Kosong',''];
    else if(r<0.9)st=['Kurang','warn'];else if(r>1.1)st=['Lebih','bad'];else st=['Tercapai','ok'];
    rows.push({k:k,label:DF_SHORT.format(parseKey(k)),d:d,w:w,st:st,empty:!(S.log[k]||[]).length,today:i===0});
  }
  return {t:t,rows:rows};
}
function weekCsv(W){
  var h='Tanggal,Kalori (kcal),Protein (g),Karbohidrat (g),Lemak (g),Serat (g),Air (L),Target kalori,Status';
  return [h].concat(W.rows.map(function(r){return [r.k,Math.round(r.d.k),Math.round(r.d.p),Math.round(r.d.c),Math.round(r.d.f),Math.round(r.d.fi),r.w.toFixed(2),W.t.kcal,r.st[0]].join(',')})).join('\n');
}
function weekText(W){
  var f=W.rows.filter(function(r){return !r.empty}),n=f.length||1;
  function avg(k){return f.reduce(function(a,r){return a+r.d[k]},0)/n}
  var lines=['RINGKASAN NUTRISI MINGGUAN - NutriSense',DF_SHORT.format(parseKey(W.rows[0].k))+' s/d '+DF_SHORT.format(parseKey(W.rows[6].k)),'Tujuan: '+goalName(S.profile.goal)+' | Target: '+W.t.kcal+' kcal, P '+W.t.p+' g, K '+W.t.c+' g, L '+W.t.f+' g, Serat '+W.t.fi+' g, Air '+W.t.water+' L',''];
  W.rows.forEach(function(r){lines.push(r.label+': '+Math.round(r.d.k)+' kcal | P '+Math.round(r.d.p)+' | K '+Math.round(r.d.c)+' | L '+Math.round(r.d.f)+' | Serat '+Math.round(r.d.fi)+' | Air '+r.w.toFixed(2)+' L | '+r.st[0])});
  lines.push('','Rata-rata ('+f.length+' hari tercatat): '+Math.round(avg('k'))+' kcal | P '+Math.round(avg('p'))+' g | K '+Math.round(avg('c'))+' g | L '+Math.round(avg('f'))+' g | Serat '+Math.round(avg('fi'))+' g');
  return lines.join('\n');
}
function viewWeekly(){
  var W=weekData(),t=W.t,f=W.rows.filter(function(r){return !r.empty}),n=f.length||1;
  function avg(k){return f.reduce(function(a,r){return a+r.d[k]},0)/n}
  var avgW=f.reduce(function(a,r){return a+r.w},0)/n;
  var mx=Math.max.apply(null,W.rows.map(function(r){return r.d.k}).concat([t.kcal])),top=Math.ceil(mx*1.1/500)*500;
  var cw=560,ch=210,L=44,R=12,T=16,B=30,pw=cw-L-R,ph=ch-T-B,bw=pw/7;
  function Y(v){return T+ph-(v/top)*ph}
  var svg='<svg class="chart" viewBox="0 0 '+cw+' '+ch+'" role="img" aria-label="Grafik kalori 7 hari terakhir">';
  [0,top/2,top].forEach(function(v){svg+='<line class="grid" x1="'+L+'" x2="'+(cw-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fmt(v)+'</text>'});
  W.rows.forEach(function(r,i){
    var h=r.d.k/top*ph,x=L+i*bw+bw*0.2,cl=r.empty?'b-0':(r.st[1]==='ok'?'b-ok':r.st[1]==='warn'?'b-lo':'b-hi');
    svg+='<rect class="'+cl+'" x="'+x+'" y="'+(T+ph-Math.max(h,2))+'" width="'+bw*0.6+'" height="'+Math.max(h,2)+'" rx="5"><title>'+r.label+': '+Math.round(r.d.k)+' kcal</title></rect>';
    if(!r.empty)svg+='<text class="v" x="'+(x+bw*0.3)+'" y="'+(T+ph-h-5)+'" text-anchor="middle">'+fmt(r.d.k)+'</text>';
    svg+='<text x="'+(x+bw*0.3)+'" y="'+(ch-10)+'" text-anchor="middle">'+r.label.split(' ').slice(0,2).join(' ')+'</text>';
  });
  svg+='<line class="tgt" x1="'+L+'" x2="'+(cw-R)+'" y1="'+Y(t.kcal)+'" y2="'+Y(t.kcal)+'"/><text x="'+(cw-R)+'" y="'+(Y(t.kcal)-4)+'" text-anchor="end" class="v">Target '+fmt(t.kcal)+'</text></svg>';
  var tbody=W.rows.map(function(r){return '<tr><td class="'+(r.today?'today':'')+'">'+r.label+(r.today?' (hari ini)':'')+'</td><td class="num">'+fmt(r.d.k)+'</td><td class="num">'+fmt(r.d.p)+'</td><td class="num">'+fmt(r.d.c)+'</td><td class="num">'+fmt(r.d.f)+'</td><td class="num">'+fmt(r.d.fi)+'</td><td class="num">'+fmt(r.w,2)+'</td><td><span class="pill '+r.st[1]+'">'+r.st[0]+'</span></td></tr>'}).join('');
  return '<div class="view">'+topbar()+
  '<div><h2 style="font-size:1.5rem">Ringkasan mingguan</h2><p class="muted">7 hari terakhir dibandingkan dengan target harian Anda.</p></div>'+
  (hasSample()?'<div class="banner"><span>Sebagian data adalah contoh. Hapus dari halaman Beranda agar laporan hanya berisi catatan Anda.</span></div>':'')+
  '<section class="card"><div class="card-h"><h2>Kalori per hari</h2><span class="pill">rata-rata '+fmt(avg('k'))+' kcal</span></div>'+svg+
   '<div class="legend"><span><i style="background:var(--green)"></i>90-110% target</span><span><i style="background:var(--carb)"></i>di bawah 90%</span><span><i style="background:var(--bad)"></i>di atas 110%</span></div></section>'+
  '<section class="card"><div class="card-h"><h2>Tabel nutrisi</h2></div><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Kalori</th><th>Protein g</th><th>Karbo g</th><th>Lemak g</th><th>Serat g</th><th>Air L</th><th>Status</th></tr></thead><tbody>'+tbody+'</tbody>'+
   '<tfoot><tr><td>Rata-rata</td><td class="num">'+fmt(avg('k'))+'</td><td class="num">'+fmt(avg('p'))+'</td><td class="num">'+fmt(avg('c'))+'</td><td class="num">'+fmt(avg('f'))+'</td><td class="num">'+fmt(avg('fi'))+'</td><td class="num">'+fmt(avgW,2)+'</td><td></td></tr>'+
   '<tr><td>Target</td><td class="num">'+fmt(t.kcal)+'</td><td class="num">'+fmt(t.p)+'</td><td class="num">'+fmt(t.c)+'</td><td class="num">'+fmt(t.f)+'</td><td class="num">'+fmt(t.fi)+'</td><td class="num">'+fmt(t.water,1)+'</td><td></td></tr></tfoot></table></div></section>'+
  '<section class="card"><div class="card-h"><h2>Ekspor laporan</h2></div><p class="muted small" style="margin-bottom:12px">Unduhan file tidak tersedia di halaman ini. Salin laporan, lalu tempel ke Excel, Google Sheets, atau catatan Anda.</p>'+
   '<div class="btnrow" style="margin-bottom:12px"><button class="btn primary" id="copytxt">'+ic('copy')+'Salin ringkasan teks</button><button class="btn" id="copycsv">'+ic('copy')+'Salin sebagai CSV</button></div>'+
   '<label class="fld"><span>Pratinjau (CSV)</span><textarea id="csvbox" class="csv" readonly>'+esc(weekCsv(W))+'</textarea></label></section></div>';
}
function bindWeekly(){
  var W=weekData(),ta=$('#csvbox');
  $('#copytxt').onclick=function(){ta.value=weekText(W);copyText(ta.value,ta)};
  $('#copycsv').onclick=function(){ta.value=weekCsv(W);copyText(ta.value,ta)};
}

/* ---------- PROFILE ---------- */
function bmiLabel(b){return b<18.5?'Kurus':b<25?'Normal':b<30?'Berlebih':'Obesitas'}
function profileSummary(){
  var t=targets(S.profile);
  var goalTxt={cut:'Defisit sekitar 20% dari kebutuhan energi harian untuk menurunkan lemak, protein tinggi untuk menjaga otot.',maint:'Kalori sama dengan kebutuhan energi harian untuk menjaga berat badan.',bulk:'Surplus sekitar 400 kcal di atas kebutuhan harian untuk membangun otot.'}[S.profile.goal];
  var cells=[['BMR',fmt(t.bmr)+' kcal'],['TDEE',fmt(t.tdee)+' kcal'],['BMI',fmt(t.bmi,1)+' ('+bmiLabel(t.bmi)+')'],['Target kalori',fmt(t.kcal)+' kcal'],['Protein',fmt(t.p)+' g'],['Karbohidrat',fmt(t.c)+' g'],['Lemak',fmt(t.f)+' g'],['Serat',fmt(t.fi)+' g'],['Air minum',fmt(t.water,1)+' L ('+t.glasses+' gelas)']];
  return '<div class="callout">'+goalTxt+'</div><div class="tgrid" style="margin-top:0">'+cells.map(function(c){return '<div class="tcell"><span>'+c[0]+'</span><b class="num" style="font-size:1.05rem">'+c[1]+'</b></div>'}).join('')+'</div>'+
   '<p class="small muted" style="margin-top:12px">Rumus Mifflin-St Jeor, dikalikan faktor aktivitas. Ini estimasi umum, bukan pengganti saran ahli gizi atau dokter.</p>';
}
function viewProfile(){
  var p=S.profile;
  return '<div class="view">'+topbar()+
  '<div><h2 style="font-size:1.5rem">Profil dan target</h2><p class="muted">Target harian dihitung otomatis dari data Anda.</p></div>'+
  '<div class="grid2" style="align-items:start"><section class="card"><div class="card-h"><h2>Data tubuh</h2></div><form id="pform" class="formgrid" novalidate>'+
   '<label class="fld"><span>Berat badan (kg)</span><input type="number" id="p-w" min="30" max="300" step="0.1" inputmode="decimal" value="'+esc(p.weight)+'"></label>'+
   '<label class="fld"><span>Tinggi badan (cm)</span><input type="number" id="p-h" min="120" max="230" inputmode="decimal" value="'+esc(p.height)+'"></label>'+
   '<label class="fld"><span>Usia (tahun)</span><input type="number" id="p-a" min="12" max="100" inputmode="numeric" value="'+esc(p.age)+'"></label>'+
   '<div class="fld"><span>Jenis kelamin</span><div class="seg" role="radiogroup" aria-label="Jenis kelamin"><label><input type="radio" name="sex" value="m"'+(p.sex==='m'?' checked':'')+'><span>Laki-laki</span></label><label><input type="radio" name="sex" value="f"'+(p.sex==='f'?' checked':'')+'><span>Perempuan</span></label></div></div>'+
   '<label class="fld full"><span>Tingkat aktivitas</span><select id="p-act">'+ACT.map(function(a){return '<option value="'+a[0]+'"'+(String(p.activity)===a[0]?' selected':'')+'>'+a[1]+'</option>'}).join('')+'</select></label>'+
   '<div class="fld full"><span>Tujuan</span><div class="seg" role="radiogroup" aria-label="Tujuan">'+GOALS.map(function(g){return '<label><input type="radio" name="goal" value="'+g[0]+'"'+(p.goal===g[0]?' checked':'')+'><span>'+g[1]+'</span></label>'}).join('')+'</div></div>'+
   '<div class="full"><button type="submit" class="btn primary" style="width:100%">Simpan profil</button></div></form></section>'+
  '<section class="card"><div class="card-h"><h2>Target harian Anda</h2></div><div id="psum">'+profileSummary()+'</div></section></div></div>';
}
function bindProfile(){
  function read(){
    var p=S.profile;
    p.weight=parseFloat($('#p-w').value)||p.weight;p.height=parseFloat($('#p-h').value)||p.height;p.age=parseFloat($('#p-a').value)||p.age;
    p.activity=$('#p-act').value;
    var s=$('input[name=sex]:checked'),g=$('input[name=goal]:checked');if(s)p.sex=s.value;if(g)p.goal=g.value;
    store();$('#psum').innerHTML=profileSummary();
  }
  $$('#pform input,#pform select').forEach(function(el){el.addEventListener('input',read);el.addEventListener('change',read)});
  $('#pform').addEventListener('submit',function(e){e.preventDefault();read();toast('Profil tersimpan. Target diperbarui.')});
}

render();
})();
</script>
